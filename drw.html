<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>LANDSLAKE Tekeningen</title>
<style>
/* Project drawings for the phone: drw.html#<project-slug> reads drw/<slug>/index.json and the page pictures next to it. */
:root{--bg:#eef1f2;--card:#fff;--ink:#1d2528;--muted:#5d6a6f;--line:#d3dadc;--acc:#1f6f86}
@media (prefers-color-scheme:dark){:root{--bg:#141a1c;--card:#1c2427;--ink:#e4eaec;--muted:#97a5aa;--line:#2f3a3e;--acc:#5fb4cc}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Arabic",Tahoma,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 40px}
.brand{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:10px}
.brand b{color:var(--ink);letter-spacing:.04em}
.langs{display:flex;gap:4px}
.langs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 9px;font:inherit;font-size:.75rem}
.langs button[aria-pressed=true]{background:var(--ink);color:var(--card)}
h1{font-size:1.5rem;margin:0 0 2px}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;cursor:zoom-in;color:inherit;font:inherit}
.pg img{width:100%;height:150px;object-fit:contain;background:#fff;border-radius:6px;display:block}
.pg span{display:block;font-size:.8rem;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:40px 10px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px}
.foot{text-align:center;font-size:.72rem;color:var(--muted);margin-top:16px}
#v{position:fixed;inset:0;background:#111;display:none;flex-direction:column;z-index:5}
#v.on{display:flex}
#v .bar{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:#000;color:#fff}
#v .bar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
#v .bar button{background:#2b3438;color:#fff;border:0;border-radius:10px;min-width:44px;height:40px;font:inherit;font-size:1.1rem}
#v .st{flex:1;position:relative;overflow:hidden;touch-action:none}
#v .st img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;background:#fff;user-select:none;-webkit-user-drag:none}
#v .hint{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:.8rem;padding:4px 10px;border-radius:99px;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="v"><div class="bar"><button data-k="x" aria-label="close">✕</button><b id="vt"></b><button data-k="out">−</button><button data-k="fit">⤢</button><button data-k="in">+</button><button data-k="prev">‹</button><button data-k="next">›</button></div><div class="st" id="st"><img id="im" alt=""><div class="hint" id="hint"></div></div></div>
<script>
const T={
 nl:{t:'Tekeningen',n:n=>`${n} pagina’s · tik om te openen, knijp om te zoomen`,none:'Geen tekeningen gevonden voor deze link.',hint:'Knijp of dubbeltik om te zoomen · veeg om te verschuiven'},
 en:{t:'Drawings',n:n=>`${n} pages · tap to open, pinch to zoom`,none:'No drawings found for this link.',hint:'Pinch or double-tap to zoom · drag to move'},
 tr:{t:'Çizimler',n:n=>`${n} sayfa · açmak için dokunun, yakınlaştırmak için iki parmak`,none:'Bu bağlantı için çizim bulunamadı.',hint:'Yakınlaştırmak için iki parmak veya çift dokunma · kaydırmak için sürükleyin'},
 ar:{t:'الرسومات',n:n=>`${n} صفحة · اضغط لتفتح، وكبّر بإصبعين`,none:'ما في رسومات لهالرابط.',hint:'كبّر بإصبعين أو بضغطتين · اسحب لتتحرك'}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang='nl'; try{ const l=localStorage.getItem('lm-lang'); if(T[l]) lang=l; else if(/^(ar|tr|en)/.test(navigator.language)) lang=navigator.language.slice(0,2); }catch(e){}
const slug=decodeURIComponent(location.hash.slice(1)).replace(/[^a-z0-9-]/g,'');
let I=null, cur=-1;
function render(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  const brand=`<div class="brand"><span><b>LANDSLAKE</b> Kozijnen &amp; Gevelbouw</span><div class="langs">${['nl','tr','ar','en'].map(l=>`<button data-l="${l}" aria-pressed="${l===lang}">${l.toUpperCase()}</button>`).join('')}</div></div>`;
  const app=document.getElementById('app');
  if(!I){ app.innerHTML=brand+`<div class="empty">${esc(t.none)}</div>`; return; }
  app.innerHTML=brand+`<h1>📐 ${esc(I.project)}</h1><div class="sub">${esc(t.t)} · ${esc(t.n(I.pages.length))}</div>
    <div class="grid">${I.pages.map((p,i)=>`<button class="pg" data-i="${i}"><img loading="lazy" src="drw/${slug}/${esc(p.thumb||p.file)}" alt=""><span>${esc(p.name)}</span></button>`).join('')}</div>
    <div class="foot">LANDSLAKE Kozijnen &amp; Gevelbouw · HAZEM ALHAMOUD</div>`;
}
// viewer: pinch / wheel / double-tap zoom around the finger, drag to move
const V=document.getElementById('v'), st=document.getElementById('st'), im=document.getElementById('im'); let s=1,x=0,y=0; const P=new Map();
function apply(){ im.style.transform=`translate(${x}px,${y}px) scale(${s})`; }
function fit(){ const r=st.getBoundingClientRect(), w=im.naturalWidth, h=im.naturalHeight; if(!w) return; s=Math.min(r.width/w,r.height/h)*.98; x=(r.width-w*s)/2; y=(r.height-h*s)/2; apply(); }
function zoom(f,cx,cy){ const r=st.getBoundingClientRect(); cx??=r.width/2; cy??=r.height/2; const n=Math.min(12,Math.max(.03,s*f)); f=n/s; x=cx-(cx-x)*f; y=cy-(cy-y)*f; s=n; apply(); }
function open(i){ if(!I||i<0||i>=I.pages.length) return; const was=cur>=0; cur=i; const p=I.pages[i]; document.getElementById('vt').textContent=`${i+1}/${I.pages.length} · ${p.name}`;
  V.classList.add('on'); im.onload=fit; im.src=`drw/${slug}/${p.file}`; if(im.complete&&im.naturalWidth) fit();
  const h=document.getElementById('hint'); h.textContent=T[lang].hint; h.style.opacity=1; setTimeout(()=>h.style.opacity=0,2500);
  if(!was) history.pushState({v:1},'',location.href); }
function close(){ V.classList.remove('on'); im.removeAttribute('src'); cur=-1; }
window.addEventListener('popstate',()=>{ if(cur>=0) close(); });
let lastTap=0;
st.addEventListener('pointerdown',e=>{ st.setPointerCapture(e.pointerId); P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const now=Date.now(); if(P.size===1&&now-lastTap<300){ const r=st.getBoundingClientRect(); zoom(2.2,e.clientX-r.left,e.clientY-r.top); lastTap=0; } else lastTap=now; });
st.addEventListener('pointermove',e=>{ const p=P.get(e.pointerId); if(!p) return; const r=st.getBoundingClientRect();
  if(P.size===2){ const [a,b]=[...P.values()], d0=Math.hypot(a.x-b.x,a.y-b.y); p.x=e.clientX; p.y=e.clientY; const [c,d]=[...P.values()], d1=Math.hypot(c.x-d.x,c.y-d.y); if(d0>0) zoom(d1/d0,(c.x+d.x)/2-r.left,(c.y+d.y)/2-r.top); return; }
  x+=e.clientX-p.x; y+=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY; apply(); });
const up=e=>P.delete(e.pointerId); st.addEventListener('pointerup',up); st.addEventListener('pointercancel',up);
st.addEventListener('wheel',e=>{ e.preventDefault(); const r=st.getBoundingClientRect(); zoom(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top); },{passive:false});
window.addEventListener('resize',()=>{ if(cur>=0) fit(); });
document.addEventListener('keydown',e=>{ if(cur<0) return; if(e.key==='Escape') history.back(); else if(e.key==='+'||e.key==='=') zoom(1.25); else if(e.key==='-') zoom(.8); else if(e.key==='ArrowRight') open(cur+1); else if(e.key==='ArrowLeft') open(cur-1); });
document.addEventListener('click',e=>{ const l=e.target.closest('[data-l]'); if(l){ lang=l.dataset.l; try{localStorage.setItem('lm-lang',lang);}catch(x){} render(); return; }
  const g=e.target.closest('[data-i]'); if(g){ open(+g.dataset.i); return; }
  const k=e.target.closest('[data-k]')?.dataset.k; if(!k) return;
  if(k==='x') history.back(); else if(k==='in') zoom(1.4); else if(k==='out') zoom(1/1.4); else if(k==='fit') fit(); else if(k==='prev') open(cur-1); else if(k==='next') open(cur+1); });
(slug?fetch(`drw/${slug}/index.json`,{cache:'no-cache'}).then(r=>r.ok?r.json():null):Promise.resolve(null)).then(j=>{ I=j&&j.pages&&j.pages.length?j:null; render(); }).catch(()=>render());
</script>
</body>
</html>
