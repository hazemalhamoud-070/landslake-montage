<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>LANDSLAKE Montage</title>
<style>
/* Montage viewer: everything shown comes from the QR code itself (after the #). No project data is stored on this site. */
:root{--bg:#eef1f2;--card:#fff;--ink:#1d2528;--muted:#5d6a6f;--line:#d3dadc;--glass:#1f6f86;--glass-soft:#d8ecf1;--frame:#2b3438;--warn:#a3620a;--warn-bg:#fdf1dc;--ok:#2e7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#141a1c;--card:#1c2427;--ink:#e4eaec;--muted:#97a5aa;--line:#2f3a3e;--glass:#5fb4cc;--glass-soft:#1d3a43;--frame:#c9d3d6;--warn:#f0b357;--warn-bg:#3a2d16;--ok:#7fcf9f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Arabic",Tahoma,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.brand{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:10px}
.brand b{color:var(--ink);letter-spacing:.04em}
.langs{display:flex;gap:4px}
.langs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 9px;font:inherit;font-size:.75rem}
.langs button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.code{font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.01em}
.size{font-variant-numeric:tabular-nums;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.where{text-align:end}
.where .house{font-size:1.35rem;font-weight:800}
.where .pos{display:inline-block;margin-top:4px;background:var(--ink);color:var(--card);border-radius:8px;padding:2px 10px;font-weight:700}
.meta{color:var(--muted);font-size:.85rem;margin-top:6px}
.draw{display:grid;justify-items:center}
.draw svg{width:100%;max-width:360px;height:auto}
.draw .seen{font-weight:700;color:var(--glass);font-size:.9rem;margin-top:2px}
.pics{display:grid;justify-items:center;gap:4px;width:100%}
.pic{direction:ltr;text-align:center;font-weight:800;color:var(--glass);width:100%;max-width:340px}
.pic .pm{display:flex;align-items:center;gap:6px}.pic .pm span{width:26px;font-size:1.1rem;flex:none}
.pic .pw{flex:1;min-width:0;position:relative}
.pic img{width:100%;max-height:360px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;display:block}
.plbl{position:absolute;top:18%;left:50%;transform:translateX(-50%);background:#fff;color:#111;border:1.5px solid #111;border-radius:4px;padding:0 6px;font-size:.85rem;font-weight:800;white-space:nowrap}
.pic .pt{font-size:1.1rem;min-height:1.3em;letter-spacing:.12em}
.pic.out{max-width:170px;opacity:.9}.pic.out .pt,.pic.out .pm span{font-size:.8rem}
.draw .seen.out{color:var(--muted);font-weight:600;font-size:.8rem}
h2{font-size:1rem;margin:0 0 8px}
.part{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.part:first-of-type{border-top:0}
.let{width:48px;height:48px;border-radius:12px;background:var(--glass);color:#fff;display:grid;place-items:center;font-size:1.7rem;font-weight:800}
.pname{font-weight:700}
.psub{font-size:.82rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{font-size:.75rem;border-radius:99px;padding:1px 8px;background:var(--glass-soft);color:var(--ink);font-weight:600}
.note{font-size:.78rem;color:var(--warn);margin-top:3px}
.right{text-align:end}
.len{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.qty{font-weight:700;color:var(--muted)}
.mat{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.mat:first-of-type{border-top:0}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.foot{text-align:center;font-size:.72rem;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const T={
 nl:{out:'Gezien van buiten',half:'½ = 1 stuk voor 2 kozijnen (gehalveerd)',seen:'Gezien van binnen — zo monteren',parts:'Onderdelen voor dit kozijn',hw:'Beslag & materiaal',L:'Links',R:'Rechts',T:'Boven',B:'Onder',tbd:'lengte volgt',pos:'Pos',none:'Scan de QR-code op een pakket.',bad:'Deze QR-code kon niet gelezen worden.',vent:'Rooster'},
 en:{out:'Seen from outside',half:'½ = one piece for 2 frames (halved)',seen:'Seen from inside — fit like this',parts:'Parts for this frame',hw:'Hardware & materials',L:'Left',R:'Right',T:'Top',B:'Bottom',tbd:'length to follow',pos:'Pos',none:'Scan the QR code on a package.',bad:'This QR code could not be read.',vent:'Vent'},
 tr:{out:'Dışarıdan görünüm',half:'½ = 2 kasa için 1 parça (ikiye bölünür)',seen:'İçeriden görünüm — böyle monte et',parts:'Bu kasanın parçaları',hw:'Aksesuar ve malzeme',L:'Sol',R:'Sağ',T:'Üst',B:'Alt',tbd:'boy sonra',pos:'Poz',none:'Paketteki QR kodunu okutun.',bad:'Bu QR kod okunamadı.',vent:'Menfez'},
 ar:{out:'منظور من برا',half:'½ = قطعة وحدة لشباكين (بتنقسم)',seen:'منظور من جوا — هيك بتركّب',parts:'قطع هالشباك',hw:'المسكات والمواد',L:'يسار',R:'يمين',T:'فوق',B:'تحت',tbd:'الطول بعدين',pos:'مكان',none:'صوّر رمز QR يلي على البكج.',bad:'ما قدرنا نقرا هالرمز.',vent:'تهوية'}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function decode(h){ // #<base64url of UTF-8 JSON>
  const b=h.replace(/-/g,'+').replace(/_/g,'/'); const bin=atob(b+'==='.slice((b.length+3)%4));
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))));
}
let D=null, lang='nl';
// v2 (short): 2!lang!project!code!W!H!block!house!pos!qty!A~prof~len~n~sides,…!name~q,…!vent   ·  v1: base64 JSON
const un=x=>decodeURIComponent(String(x||'').replace(/_/g,' '));
function parse2(h){ const F=h.split('!'); const num=x=>x===''?null:(x==='.5'?0.5:+x);
  return {v:2,lang:un(F[1]),project:un(F[2]),code:un(F[3]),W:un(F[4]),H:un(F[5]),b:un(F[6]),h:un(F[7]),pos:un(F[8]),qty:un(F[9]),
    parts:(F[10]?F[10].split(','):[]).map(x=>{ const q=x.split('~').map(un); return [q[0],q[1],q[2]===''?null:q[2],num(q[3]),q[4]]; }),
    mats:(F[11]?F[11].split(','):[]).map(x=>x.split('~').map(un)),vent:un(F[12]),img:/^[a-z0-9-]+\/[a-z0-9-]+$/.test(un(F[13]))?un(F[13]):'',type:''}; }
try{ let h=location.hash.slice(1); try{ if(/%21|%7E/i.test(h)) h=decodeURIComponent(h); }catch(x){}
  if(h){ if(/^2!/.test(h)) D=parse2(h); else { const a=decode(h); D={v:a[0],lang:a[1],project:a[2],code:a[3],W:a[4],H:a[5],b:a[6],h:a[7],pos:a[8],qty:a[9],parts:a[10]||[],mats:a[11]||[],vent:a[12]||'',type:a[13]||''}; }
    lang=T[D.lang]?D.lang:'nl'; } }catch(e){ D={bad:true}; }
try{ const l=localStorage.getItem('lm-lang'); if(T[l]) lang=l; }catch(e){}
// real drawing (seen from inside) with the letters around it, plus a small mirror = seen from outside
function picture(){
  const lets=side=>D.parts.filter(p=>String(p[4]||'').includes(side)).map(p=>p[0]).join(' ');
  const one=(mirror)=>{ let L=lets('L'),R=lets('R'); if(mirror)[L,R]=[R,L];
    return `<div class="pic${mirror?' out':''}"><div class="pt">${esc(lets('T'))}</div><div class="pm"><span>${esc(L)}</span><div class="pw">${mirror
      ? `<img src="img/${D.img}-out.jpg" alt="" onerror="this.onerror=null;this.src='img/${D.img}.jpg';this.style.transform='scaleX(-1)'"><b class="plbl">${esc(D.code)}</b>`
      : `<img src="img/${D.img}.jpg" alt="" onerror="this.closest('.pics').outerHTML=drawing()">`}</div><span>${esc(R)}</span></div><div class="pt">${esc(lets('B'))}</div></div>`; };
  return `<div class="pics">${one(false)}<div class="seen">👁 ${esc(T[lang].seen)}</div>${one(true)}<div class="seen out">👁 ${esc(T[lang].out)}</div></div>`;
}
function drawing(){ // frame to scale, letters on the side where each piece goes (seen from inside)
  const W=+D.W||1000,H=+D.H||1000,box=180,s=box/Math.max(W,H),rw=W*s,rh=H*s,x=(300-rw)/2,y=(300-rh)/2;
  const lets=side=>D.parts.filter(p=>String(p[4]||'').includes(side)).map(p=>p[0]).join(' ');
  const Tt=lets('T'),Bb=lets('B'),Ll=lets('L'),Rr=lets('R');
  return `<svg viewBox="0 0 300 300" role="img" aria-label="${W} x ${H}">
    <rect x="${x}" y="${y}" width="${rw}" height="${rh}" rx="2" fill="var(--glass-soft)" stroke="var(--frame)" stroke-width="5"/>
    <text x="150" y="${y+rh/2+5}" text-anchor="middle" font-size="13" fill="var(--muted)" style="direction:ltr">${W} × ${H}</text>
    ${Tt?`<line x1="${x}" y1="${y-10}" x2="${x+rw}" y2="${y-10}" stroke="var(--glass)" stroke-width="6" stroke-linecap="round"/><text x="150" y="${y-20}" text-anchor="middle" font-size="18" font-weight="800" fill="var(--glass)">${Tt}</text>`:''}
    ${Bb?`<line x1="${x}" y1="${y+rh+10}" x2="${x+rw}" y2="${y+rh+10}" stroke="var(--glass)" stroke-width="6" stroke-linecap="round"/><text x="150" y="${y+rh+34}" text-anchor="middle" font-size="18" font-weight="800" fill="var(--glass)">${Bb}</text>`:''}
    ${Ll?`<line x1="${x-10}" y1="${y}" x2="${x-10}" y2="${y+rh}" stroke="var(--glass)" stroke-width="6" stroke-linecap="round"/><text x="${x-18}" y="${y+rh/2+6}" text-anchor="end" font-size="18" font-weight="800" fill="var(--glass)">${Ll}</text>`:''}
    ${Rr?`<line x1="${x+rw+10}" y1="${y}" x2="${x+rw+10}" y2="${y+rh}" stroke="var(--glass)" stroke-width="6" stroke-linecap="round"/><text x="${x+rw+18}" y="${y+rh/2+6}" text-anchor="start" font-size="18" font-weight="800" fill="var(--glass)">${Rr}</text>`:''}
  </svg>`;
}
const nf=n=>n===0.5?'½':String(n);
function render(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  const langs=`<div class="langs">${['nl','tr','ar','en'].map(l=>`<button data-l="${l}" aria-pressed="${l===lang}">${l.toUpperCase()}</button>`).join('')}</div>`;
  const brand=`<div class="brand"><span><b>LANDSLAKE</b> Kozijnen &amp; Gevelbouw</span>${langs}</div>`;
  if(!D||D.bad){ document.getElementById('app').innerHTML=brand+`<div class="card empty">${esc(D&&D.bad?t.bad:t.none)}</div>`; return; }
  const parts=D.parts.map(p=>`<div class="part"><div class="let">${esc(p[0])}</div>
      <div><div class="pname">${esc(p[1])}</div><div class="chips">${[...String(p[4]||'')].filter(c=>'LRTB'.includes(c)).map(c=>`<span class="chip">${esc(t[c])}</span>`).join('')}</div>${p[5]?`<div class="note">${esc(p[5])}</div>`:p[3]===0.5?`<div class="note">${esc(t.half)}</div>`:''}</div>
      <div class="right"><div class="len">${p[2]!=null?esc(p[2])+' <small>mm</small>':`<small>${esc(t.tbd)}</small>`}</div><div class="qty">× ${esc(nf(p[3]))}</div></div></div>`).join('');
  const mats=D.mats.map(m=>`<div class="mat"><span>${esc(m[0])}</span><b>× ${esc(m[1])}</b></div>`).join('')+(D.vent?`<div class="mat"><span>🌬 ${esc(t.vent)}: ${esc(D.vent)}</span><b>× 1</b></div>`:'');
  document.getElementById('app').innerHTML=brand+`
    <div class="card"><div class="head"><div><div class="code">${esc(D.code)}</div><div class="size">${esc(D.W||'?')} × ${esc(D.H||'?')} mm</div></div>
      <div class="where">${D.b?`<div class="house">${esc(D.b)}${D.h!=null&&D.h!==''?' · '+esc(D.h):''}</div>`:''}${D.pos?`<span class="pos">${esc(t.pos)} ${esc(D.pos)}</span>`:D.qty?`<span class="pos">× ${esc(D.qty)}</span>`:''}</div></div>
      <div class="meta">${esc(D.project)}${D.type?' · '+esc(D.type):''}</div></div>
    <div class="card draw">${D.img?picture():drawing()+`<div class="seen">👁 ${esc(t.seen)}</div>`}</div>
    <div class="card"><h2>${esc(t.parts)}</h2>${parts}</div>
    ${mats?`<div class="card"><h2>${esc(t.hw)}</h2>${mats}</div>`:''}
    <div class="foot">LANDSLAKE Kozijnen &amp; Gevelbouw · HAZEM ALHAMOUD</div>`;
}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-l]'); if(b){ lang=b.dataset.l; try{localStorage.setItem('lm-lang',lang);}catch(x){} render(); } });
window.addEventListener('hashchange',()=>location.reload());
render();
</script>
</body>
</html>
